GradingPeriodsCollection:
  get:
    tags: [Grading]
    summary: List grading periods (admin)
    description: >
      View all grading periods for the school. Filters: `title`,
      `startswith=1` (match titles beginning with `title`).

    operationId: listGradingPeriods
    x-student-access: forbidden
    parameters:
      - name: title
        in: query
        description: Filter by title.
        schema: { type: string }
      - name: startswith
        description: Set to `1` to match titles that begin with `title`.
        in: query
        schema: { type: string, enum: ["1"] }
    responses:
      '200':
        description: A collection of grading periods.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/GradingPeriodCollection' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
  post:
    tags: [Grading]
    summary: Create a grading period (admin)
    operationId: createGradingPeriod
    x-student-access: unknown
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/_index.yaml#/GradingPeriodCreate' }
    responses:
      '201':
        description: The created grading period.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/GradingPeriod' }
      '400': { $ref: '../components/responses/_index.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }

GradingPeriodItem:
  get:
    tags: [Grading]
    summary: Get a grading period (admin)
    operationId: getGradingPeriod
    x-student-access: ok
    x-verified: true
    parameters:
      - $ref: '../components/parameters/_index.yaml#/grading_period_id'
    responses:
      '200':
        description: A grading period.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/GradingPeriod' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
      '404': { $ref: '../components/responses/_index.yaml#/NotFound' }
  put:
    tags: [Grading]
    summary: Update a grading period (admin)
    description: Modify a grading period. Returns 204 No Content.
    operationId: updateGradingPeriod
    x-student-access: unknown
    parameters:
      - $ref: '../components/parameters/_index.yaml#/grading_period_id'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/_index.yaml#/GradingPeriodWritable' }
    responses:
      '204': { $ref: '../components/responses/_index.yaml#/Empty204' }
      '400': { $ref: '../components/responses/_index.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
      '404': { $ref: '../components/responses/_index.yaml#/NotFound' }
  delete:
    tags: [Grading]
    summary: Delete a grading period (admin)
    description: >
      Delete a grading period (cannot be undone). All course sections belonging
      to it must first be deleted or reassigned.
    operationId: deleteGradingPeriod
    x-student-access: unknown
    parameters:
      - $ref: '../components/parameters/_index.yaml#/grading_period_id'
    responses:
      '204': { $ref: '../components/responses/_index.yaml#/Empty204' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
      '404': { $ref: '../components/responses/_index.yaml#/NotFound' }

