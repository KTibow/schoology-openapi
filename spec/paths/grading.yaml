SectionGrades:
  get:
    tags: [Grading]
    summary: List a section's grades (teacher)
    description: >
      View grades for the section (paged). Filters: `assignment_id`,
      `enrollment_id`, `timestamp`. Without filters, returns all grades for all
      assignments and students. Also includes per-period and final grades.

    operationId: listSectionGrades
    x-student-access: forbidden
    parameters:
      - $ref: '../components/parameters/_index.yaml#/section_id'
      - $ref: '../components/parameters/_index.yaml#/start'
      - $ref: '../components/parameters/_index.yaml#/limit'
      - name: assignment_id
        in: query
        description: Filter by assignment id.
        schema: { type: string }
      - name: enrollment_id
        in: query
        description: Filter by enrollment id.
        schema: { type: string }
      - name: timestamp
        in: query
        description: Unix timestamp — only grades updated since then.
        schema: { type: string }
    responses:
      '200':
        description: Grades, periods and final grades.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/SectionGrades' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
      '404': { $ref: '../components/responses/_index.yaml#/NotFound' }
  put:
    tags: [Grading]
    summary: Set grades
    description: >
      Set/modify grades — one body shape writes grades
      (`{"grades": {"grade": [...]}}`), another writes period/final comments
      (`{"final_comments": {"final_comment": [...]}}`).
    operationId: updateSectionGrades
    x-student-access: unknown
    parameters:
      - $ref: '../components/parameters/_index.yaml#/section_id'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '../components/schemas/_index.yaml#/GradesInput'
              - $ref: '../components/schemas/_index.yaml#/FinalCommentsInput'
    responses:
      '204': { $ref: '../components/responses/_index.yaml#/Empty204' }
      '400': { $ref: '../components/responses/_index.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
      '404': { $ref: '../components/responses/_index.yaml#/NotFound' }

SectionAttendance:
  get:
    tags: [Grading]
    summary: List a section's attendance (teacher)
    description: >
      View attendance statuses (paged). Filters: `start`/`end` (YYYY-MM-DD,
      inclusive), `enrollment_id`. Records for *present* are generally omitted.
      Returns 410 Gone when the district uses the PowerSchool SIS Attendance
      App.
    operationId: listSectionAttendance
    x-student-access: forbidden
    parameters:
      - $ref: '../components/parameters/_index.yaml#/section_id'
      - name: start
        in: query
        description: Range start (YYYY-MM-DD).
        schema: { type: string }
      - name: end
        in: query
        description: Range end (YYYY-MM-DD).
        schema: { type: string }
      - name: enrollment_id
        description: Filter by enrollment id.
        in: query
        schema: { type: string }
    responses:
      '200':
        description: Attendance records grouped by date, plus totals.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/Attendance' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
      '410': { $ref: '../components/responses/_index.yaml#/Gone' }
  put:
    tags: [Grading]
    summary: Set attendance
    description: >
      Modify attendance statuses wrapped in
      `{"attendances": {"attendance": [...]}}`. Returns per-entry ids and
      response codes. Returns 410 Gone with the PowerSchool SIS Attendance App.
    operationId: updateSectionAttendance
    x-student-access: unknown
    parameters:
      - $ref: '../components/parameters/_index.yaml#/section_id'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/_index.yaml#/AttendanceInput' }
    responses:
      '200':
        description: Attendance ids and response codes.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/AttendanceBulkResult' }
      '400': { $ref: '../components/responses/_index.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
      '410': { $ref: '../components/responses/_index.yaml#/Gone' }

