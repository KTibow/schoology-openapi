Documents:
  parameters:
    - name: realm
      in: path
      required: true
      description: >
        Realm collection that owns the documents.
      schema:
        type: string
        enum: [sections, schools]
  get:
    tags: [Documents]
    summary: List documents in a realm
    description: >
      View a paged list of documents (standalone files/links) in the realm.
      Documents always include their `attachments` block; `with_tags` is also
      supported. School-realm document listings are privileged.
    operationId: listDocuments
    x-student-access: ok
    x-student-access-by-realm: { schools: forbidden, sections: ok }
    x-verified: true
    parameters:
      - $ref: '../components/parameters/_index.yaml#/realm_id'
      - $ref: '../components/parameters/_index.yaml#/start'
      - $ref: '../components/parameters/_index.yaml#/limit'
      - $ref: '../components/parameters/_index.yaml#/with_tags'
    responses:
      '200':
        description: A paged collection of documents.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/DocumentCollection' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
  post:
    tags: [Documents]
    summary: Create a document
    description: >
      Create a document. Exactly one attachment is required — a link/embed via
      `url`, or uploaded files via `file-attachment` (files win when both are
      given).
    operationId: createDocument
    x-student-access: unknown
    parameters:
      - $ref: '../components/parameters/_index.yaml#/realm_id'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/_index.yaml#/DocumentWritable' }
    responses:
      '201':
        description: The created document.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/Document' }
      '400': { $ref: '../components/responses/_index.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }

