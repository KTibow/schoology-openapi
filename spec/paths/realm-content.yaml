Events:
  parameters:
    - name: realm
      in: path
      required: true
      description: >
        Realm collection that owns the events.
      schema:
        type: string
        enum: [sections, groups, users, schools, districts]
  get:
    tags: [Events]
    summary: List events in a realm
    description: >
      View a paged list of events in the realm. `start_date`/`end_date`
      (YYYY-MM-DD or YYYYMMDD) limit the result set by date; due dates of
      assignments/discussions appear as read-only events of those types.
    operationId: listEvents
    x-student-access: ok
    x-verified: true
    parameters:
      - $ref: '../components/parameters/_index.yaml#/realm_id'
      - $ref: '../components/parameters/_index.yaml#/start'
      - $ref: '../components/parameters/_index.yaml#/limit'
      - name: start_date
        in: query
        description: Range start (YYYY-MM-DD or YYYYMMDD).
        schema: { type: string }
      - name: end_date
        in: query
        description: Range end (YYYY-MM-DD or YYYYMMDD).
        schema: { type: string }
      - $ref: '../components/parameters/_index.yaml#/with_attachments'
    responses:
      '200':
        description: A paged collection of events.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/EventCollection' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
  post:
    tags: [Events]
    summary: Create an event
    operationId: createEvent
    x-student-access: unknown
    parameters:
      - $ref: '../components/parameters/_index.yaml#/realm_id'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/_index.yaml#/EventCreate' }
    responses:
      '201':
        description: The created event.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/Event' }
      '400': { $ref: '../components/responses/_index.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }

