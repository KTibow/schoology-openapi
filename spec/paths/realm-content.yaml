# Shared realm-generic material endpoints.
#
# These live at `/{realm}/{realm_id}/...`. Each path item declares the realms
# that material supports as the `realm` parameter's enum, so the enum is the
# single source of truth (it replaces the old `x-realms`):
#   discussions -> sections, groups, schools, districts
#   documents   -> sections, schools
#   events      -> sections, groups, users, schools, districts
#   updates     -> sections, groups, users
#   albums      -> sections, groups
#   posts       -> sections, groups, users, schools, districts

Discussions:
  parameters:
    - name: realm
      in: path
      required: true
      description: >
        Realm collection that owns the discussion threads.
      schema:
        type: string
        enum: [sections, groups, schools, districts]
  get:
    tags: [Discussions]
    summary: List discussions in a realm
    description: >
      View a paged list of discussion threads in the realm. Supports
      `with_attachments` and `with_tags`.
    operationId: listDiscussions
    x-student-access: ok
    x-verified: true
    parameters:
      - $ref: '../components/parameters/_index.yaml#/realm_id'
      - $ref: '../components/parameters/_index.yaml#/start'
      - $ref: '../components/parameters/_index.yaml#/limit'
      - $ref: '../components/parameters/_index.yaml#/with_attachments'
      - $ref: '../components/parameters/_index.yaml#/with_tags'
    responses:
      '200':
        description: A paged collection of discussions.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/DiscussionCollection' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
  post:
    tags: [Discussions]
    summary: Create a discussion
    operationId: createDiscussion
    x-student-access: unknown
    parameters:
      - $ref: '../components/parameters/_index.yaml#/realm_id'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/_index.yaml#/DiscussionCreate' }
    responses:
      '201':
        description: The created discussion.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/Discussion' }
      '400': { $ref: '../components/responses/_index.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }

DiscussionItem:
  parameters:
    - name: realm
      in: path
      required: true
      description: >
        Realm collection that owns the discussion threads.
      schema:
        type: string
        enum: [sections, groups, schools, districts]
  get:
    tags: [Discussions]
    summary: Get a discussion
    description: View a specified discussion thread. Supports `with_attachments` and `with_tags`.
    operationId: getDiscussion
    x-student-access: ok
    x-verified: true
    parameters:
      - $ref: '../components/parameters/_index.yaml#/realm_id'
      - $ref: '../components/parameters/_index.yaml#/post_id'
      - $ref: '../components/parameters/_index.yaml#/with_attachments'
      - $ref: '../components/parameters/_index.yaml#/with_tags'
    responses:
      '200':
        description: A discussion.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/Discussion' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
      '404': { $ref: '../components/responses/_index.yaml#/NotFound' }
  put:
    tags: [Discussions]
    summary: Update a discussion
    operationId: updateDiscussion
    x-student-access: unknown
    parameters:
      - $ref: '../components/parameters/_index.yaml#/realm_id'
      - $ref: '../components/parameters/_index.yaml#/post_id'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/_index.yaml#/DiscussionWritable' }
    responses:
      '204': { $ref: '../components/responses/_index.yaml#/Empty204' }
      '400': { $ref: '../components/responses/_index.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
      '404': { $ref: '../components/responses/_index.yaml#/NotFound' }
  delete:
    tags: [Discussions]
    summary: Delete a discussion
    description: Delete a discussion thread (cannot be undone).
    operationId: deleteDiscussion
    x-student-access: unknown
    parameters:
      - $ref: '../components/parameters/_index.yaml#/realm_id'
      - $ref: '../components/parameters/_index.yaml#/post_id'
    responses:
      '204': { $ref: '../components/responses/_index.yaml#/Empty204' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
      '404': { $ref: '../components/responses/_index.yaml#/NotFound' }

