Assignments:
  get:
    tags: [Assignments]
    summary: List assignments in a section
    description: >
      View a paged list of assignments, ordered by type (non-final then final)
      then due date. Supports `with_attachments`, `with_tags`, and
      `with_dropbox_stats` (teachers). Note that `limit` is applied per
      assignment type, not to the result set as a whole, so a request can come
      back with more rows than the limit.
    operationId: listAssignments
    x-student-access: ok
    x-verified: true
    parameters:
      - $ref: '../components/parameters/_index.yaml#/section_id'
      - $ref: '../components/parameters/_index.yaml#/start'
      - $ref: '../components/parameters/_index.yaml#/limit'
      - $ref: '../components/parameters/_index.yaml#/with_attachments'
      - $ref: '../components/parameters/_index.yaml#/with_tags'
      - $ref: '../components/parameters/_index.yaml#/with_dropbox_stats'
    responses:
      '200':
        description: A paged collection of assignments.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/AssignmentCollection' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
      '404': { $ref: '../components/responses/_index.yaml#/NotFound' }
  post:
    tags: [Assignments]
    summary: Create an assignment
    operationId: createAssignment
    x-student-access: unknown
    parameters:
      - $ref: '../components/parameters/_index.yaml#/section_id'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/_index.yaml#/AssignmentCreate'
              - $ref: '../components/schemas/_index.yaml#/AttachmentsInput'
    responses:
      '201':
        description: The created assignment.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/Assignment' }
      '400': { $ref: '../components/responses/_index.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }

AssignmentItem:
  get:
    tags: [Assignments]
    summary: Get an assignment
    operationId: getAssignment
    x-student-access: ok
    x-verified: true
    parameters:
      - $ref: '../components/parameters/_index.yaml#/section_id'
      - $ref: '../components/parameters/_index.yaml#/assignment_id'
      - $ref: '../components/parameters/_index.yaml#/with_attachments'
      - $ref: '../components/parameters/_index.yaml#/with_tags'
    responses:
      '200':
        description: An assignment.
        content:
          application/json:
            schema: { $ref: '../components/schemas/_index.yaml#/Assignment' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
      '404': { $ref: '../components/responses/_index.yaml#/NotFound' }
  put:
    tags: [Assignments]
    summary: Update an assignment
    description: >
      Modify an assignment. Attachment rules on PUT: an existing attachment
      must be sent back with its `id` to survive — omit the `id` and that
      attachment is deleted. Only an attachment's `title` can be updated.
    operationId: updateAssignment
    x-student-access: unknown
    parameters:
      - $ref: '../components/parameters/_index.yaml#/section_id'
      - $ref: '../components/parameters/_index.yaml#/assignment_id'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/_index.yaml#/AssignmentWritable'
              - $ref: '../components/schemas/_index.yaml#/AttachmentsInput'
    responses:
      '204': { $ref: '../components/responses/_index.yaml#/Empty204' }
      '400': { $ref: '../components/responses/_index.yaml#/BadRequest' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
      '404': { $ref: '../components/responses/_index.yaml#/NotFound' }
  delete:
    tags: [Assignments]
    summary: Delete an assignment
    description: Delete an assignment (cannot be undone).
    operationId: deleteAssignment
    x-student-access: unknown
    parameters:
      - $ref: '../components/parameters/_index.yaml#/section_id'
      - $ref: '../components/parameters/_index.yaml#/assignment_id'
    responses:
      '204': { $ref: '../components/responses/_index.yaml#/Empty204' }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
      '404': { $ref: '../components/responses/_index.yaml#/NotFound' }

