    description: >
      School-wide admins only. `fields` selects columns (uid, school_uid,
      name_first, name_last, mail, title, group_code, type, status); omit for
      all fields. Response is `text/csv`.
    operationId: csvExportGroupEnrollments
    x-student-access: forbidden
    parameters:
      - name: fields
        description: Comma-separated column list to export (omit for all fields).
        in: query
        schema: { type: string }
    responses:
      '200':
        description: CSV export.
        content:
          text/csv:
            schema: { type: string }
      '401': { $ref: '../components/responses/_index.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses/_index.yaml#/Forbidden' }
